[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-car-agent"
version = "0.1.0"
description = "A tool-using used classic sports car sales agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[litellm]>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
notebook = [
    "jupyterlab>=4,<5",
    "nbconvert>=7,<8",
    "ipykernel>=6,<7",
]

[project.scripts]
car-agent-verify = "car_agent.verify_cli:main"
car-agent-ingest = "car_agent.ingest_cli:main"
car-agent-evaluate = "car_agent.evaluate_cli:main"
car-agent-demo = "car_agent.demo_cli:main"
car-agent-profile = "car_agent.profile_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
car_agent = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
