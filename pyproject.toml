[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-car-agent"
version = "0.1.0"
description = "A tool-using used classic sports car sales agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai>=1.15,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
notebook = [
    "jupyterlab>=4,<5",
    "nbconvert>=7,<8",
    "ipykernel>=6,<7",
]

[project.scripts]
car-agent-verify = "car_agent.verify_cli:main"
car-agent-ingest = "car_agent.ingest_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
